server {
    listen 80;
    server_name localhost;

    # Racine des fichiers statiques React
    root /usr/share/nginx/html;
    index index.html;

    # Proxy des appels API vers le backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeout étendu pour les uploads de gros CSV
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback : toutes les routes non-fichiers renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Désactiver les logs d'accès pour les healthchecks
    location = /api/health {
        access_log off;
        proxy_pass http://backend:8000/api/health;
    }
}
