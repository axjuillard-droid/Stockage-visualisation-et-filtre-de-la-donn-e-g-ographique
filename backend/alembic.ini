# Configuration Alembic
# Documentation : https://alembic.sqlalchemy.org/

[alembic]
# Chemin vers le dossier de migrations
script_location = alembic

# Format des noms de fichiers de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone pour les horodatages de migration
timezone = UTC

# URL de connexion — surchargée par env.py via DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://poc:poc@db:5432/poc

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
